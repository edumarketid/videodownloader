<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teala'a Nuvidio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fa-solid font-bold fa-download text-indigo-500 text-xl"></i>
      <h1 class="text-lg font-bold tracking-wide">Teala'a Nuvidio</h1>
    </div>
    <button id="installBtn" class="hidden bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
      <i class="fa-solid fa-mobile-screen"></i> Install App
    </button>
  </header>

  <!-- Main Content -->
  <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold">Ala Te Video Mini Media Sosial</h2>
        <p class="text-xs text-slate-400">Tempele'e na URL video mini Facebook, TikTok, atau YouTube</p>
      </div>

      <!-- Input Form -->
      <div class="space-y-3">
        <div class="relative">
          <input type="url" id="videoUrl" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition pr-10">
          <button id="pasteBtn" class="absolute right-3 top-3 text-slate-400 hover:text-indigo-400 text-sm">
            <i class="fa-regular fa-paste"></i>
          </button>
        </div>

        <button id="fetchBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition flex justify-center items-center gap-2 text-sm">
          <span>Tindisi'e</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- Loader -->
      <div id="loader" class="hidden text-center py-4">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
        <p class="text-xs text-slate-400 mt-2">Mengambil data media...</p>
      </div>

      <!-- Result Card -->
      <div id="resultCard" class="hidden bg-slate-900 border border-slate-700 rounded-xl p-4 text-center space-y-3">
        <p class="text-sm font-medium text-emerald-400"><i class="fa-solid fa-circle-check"></i> Video Siap Diunduh!</p>
        <a id="downloadLink" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition">
          <i class="fa-solid fa-file-arrow-down"></i> Unduh Sekarang
        </a>
      </div>

      <!-- Error Message -->
      <div id="errorMsg" class="hidden bg-rose-950/50 border border-rose-800 text-rose-300 text-xs rounded-xl p-3 text-center"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="p-4 text-center text-xs text-slate-500">
    <p>Offline-First Progressive Web App</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
